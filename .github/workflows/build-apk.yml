name: Build Stock APK

# Cloud-builds the Android APK (debug-signed) and uploads it as an artifact.
# Mirrors the proven family-locator flow: regenerate the Flutter Android
# scaffold, overlay our manifest/res/MainActivity, inject the google-services
# plugin, pin minSdk/ndk, restore google-services.json from a secret, build.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: false

      - name: Generate Android scaffold + overlay
        run: |
          set -e
          mkdir -p /tmp/keep
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/AndroidManifest.xml
          cp -r android/app/src/main/res /tmp/keep/res
          rm -rf android
          flutter create --platforms=android --org com.pawan --project-name stockanalysis .
          # Restore our manifest, resources, and Kotlin MainActivity package.
          cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -rf /tmp/keep/res/* android/app/src/main/res/

          # Inject google-services plugin into the generated Gradle files.
          if [ -f android/settings.gradle.kts ]; then
            SET=android/settings.gradle.kts; APP=android/app/build.gradle.kts
            sed -i 's#id("com.android.application") version.*apply false#&\n    id("com.google.gms.google-services") version "4.4.2" apply false#' "$SET"
            sed -i 's#id("com.android.application")#&\n    id("com.google.gms.google-services")#' "$APP"
          else
            SET=android/settings.gradle; APP=android/app/build.gradle
            sed -i 's#id "com.android.application" version.*apply false#&\n    id "com.google.gms.google-services" version "4.4.2" apply false#' "$SET"
            sed -i 's#id "com.android.application"#&\n    id "com.google.gms.google-services"#' "$APP"
          fi
          # Firebase needs minSdk >= 23; several plugins need NDK 27.
          sed -i 's#flutter.minSdkVersion#23#g' "$APP"
          sed -i 's#flutter.ndkVersion#"27.0.12077973"#g' "$APP"

          # flutter_local_notifications requires core library desugaring.
          if [ -f android/settings.gradle.kts ]; then
            # Kotlin DSL: enable desugaring in compileOptions and add the dep.
            sed -i 's#isCoreLibraryDesugaringEnabled = true##g' "$APP"
            sed -i 's#compileOptions {#compileOptions {\n        isCoreLibraryDesugaringEnabled = true#' "$APP"
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")\n}\n' >> "$APP"
          else
            sed -i 's#coreLibraryDesugaringEnabled true##g' "$APP"
            sed -i 's#compileOptions {#compileOptions {\n        coreLibraryDesugaringEnabled true#' "$APP"
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"\n}\n' >> "$APP"
          fi
          echo "----- $APP -----"; cat "$APP"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret not set."; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
